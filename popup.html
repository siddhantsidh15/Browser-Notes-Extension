<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Save to Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      [data-theme="light"] {
        --bg: #f4f1ea;
        --surface: #ffffff;
        --surface2: #f7f5f0;
        --border: #d9d5c8;
        --border-hover: #c8c0b4;
        --text: #2c2c3e;
        --muted: #7a7a9a;
        --accent: #8e44ad;
        --accent-dim: rgba(142, 68, 173, 0.12);
        --accent-border: rgba(142, 68, 173, 0.3);
        --red: #c0392b;
        --red-dim: rgba(192, 57, 43, 0.12);
        --green: #1a9e6b;
        --link: #2471a3;
      }

      [data-theme="dark"] {
        --bg: #0f0f1a;
        --surface: #1c1c32;
        --surface2: #222240;
        --border: #2e2e50;
        --border-hover: #404070;
        --text: #dcdcf0;
        --muted: #6868a0;
        --accent: #a070e0;
        --accent-dim: rgba(160, 112, 224, 0.15);
        --accent-border: rgba(160, 112, 224, 0.35);
        --red: #e05555;
        --red-dim: rgba(224, 85, 85, 0.15);
        --green: #6bffc0;
        --link: #60a8d0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 600px;
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 560px;
      }

      /* ── Header ── */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }

      .header-left {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .app-name {
        font-family: "Fraunces", serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.3px;
        margin: 0;
        line-height: 1;
      }

      .app-name em {
        font-style: italic;
        color: var(--accent);
      }

      .note-pill {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        font-weight: 500;
        background: var(--accent-dim);
        color: var(--accent);
        border: 1px solid var(--accent-border);
        border-radius: 20px;
        padding: 2px 8px;
        letter-spacing: 0.3px;
        transition: opacity 0.2s;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        width: 28px;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        font-size: 14px;
        padding: 0;
      }

      .icon-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
        background: var(--surface2);
      }

      .btn-full {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }

      .btn-full:hover {
        border-color: var(--accent-border);
        color: var(--accent);
        background: var(--accent-dim);
      }

      /* ── Search ── */
      .search-wrap {
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .search-icon {
        position: absolute;
        left: 28px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 13px;
        pointer-events: none;
      }

      input[type="text"] {
        flex: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        padding: 7px 12px 7px 32px;
        outline: none;
        transition: border-color 0.15s;
      }

      input[type="text"]::placeholder {
        color: var(--muted);
      }
      input[type="text"]:focus {
        border-color: var(--accent-border);
      }

      .search-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .search-action-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        height: 29px;
        padding: 0 8px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        transition: all 0.15s;
      }

      .search-action-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
        background: var(--surface2);
      }

      .search-action-btn.active {
        background: var(--accent-dim);
        border-color: var(--accent-border);
        color: var(--accent);
      }
      .search-action-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: var(--border);
        background: none;
        color: var(--muted);
      }

      /* ── Notes List ── */
      .notes-list {
        padding: 10px 14px;
        overflow-y: auto;
        flex: 1;
        min-height: 380px;
        max-height: 420px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      /* ── Date Group ── */
      .date-group {
        margin-bottom: 6px;
      }

      .date-heading {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 8px 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .date-heading::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ── Domain Row ── */
      .domain-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 6px;
      }

      .domain-favicon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        opacity: 0.8;
      }

      .domain-label {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      /* ── Note Card ── */
      .note-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 13px;
        margin-bottom: 7px;
        position: relative;
        transition:
          border-color 0.2s,
          background 0.2s;
        overflow: hidden;
      }

      .note-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
        opacity: 0;
        transition: opacity 0.2s;
        border-radius: 10px 0 0 10px;
      }

      .note-card:hover {
        border-color: var(--border-hover);
        background: var(--surface2);
      }

      .note-card:hover::before {
        opacity: 1;
      }

      .note-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
      }

      .note-time {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      /* ── Copy Dots ── */
      .copy-indicators {
        display: flex;
        gap: 4px;
        margin-left: 10px;
        align-items: center;
      }

      .copy-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--surface2);
        border: 1px solid var(--border);
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .copy-dot.active {
        background: var(--green);
        border-color: var(--green);
        box-shadow: 0 0 4px rgba(107, 255, 192, 0.4);
      }

      .note-source {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--link);
        text-decoration: none;
        letter-spacing: 0.3px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .note-card:hover .note-source {
        opacity: 1;
      }

      .note-body {
        font-size: 13px;
        line-height: 1.55;
        color: var(--text);
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        line-clamp: 10;
        -webkit-line-clamp: 10;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── Card Action Buttons ── */
      .note-actions {
        position: absolute;
        bottom: 9px;
        right: 9px;
        display: flex;
        gap: 4px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.2s,
          transform 0.2s;
      }

      .note-card:hover .note-actions {
        opacity: 1;
        transform: translateY(0);
      }

      .card-btn {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--muted);
        width: 26px;
        height: 26px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: all 0.15s;
        padding: 0;
      }

      .card-btn:hover {
        background: var(--accent-dim);
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .card-btn.del:hover {
        background: var(--red-dim);
        border-color: rgba(255, 107, 107, 0.3);
        color: var(--red);
      }

      /* ── Empty State ── */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        gap: 10px;
        color: var(--muted);
      }

      .empty-icon {
        font-size: 28px;
        opacity: 0.4;
      }

      .empty-text {
        font-family: "Fraunces", serif;
        font-style: italic;
        font-size: 15px;
        opacity: 0.6;
      }

      /* ── Pagination ── */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 8px 16px;
        background: var(--bg);
        border-top: 1px solid var(--border);
      }

      .pg-btn {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .pg-btn:hover:not(:disabled) {
        border-color: var(--border-hover);
        color: var(--text);
      }

      .pg-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .pg-info {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      /* ── Footer ── */
      .footer {
        padding: 7px 16px;
        background: var(--bg);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-stat {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      .storage-bar-wrap {
        width: 60px;
        height: 3px;
        background: var(--surface2);
        border-radius: 2px;
        overflow: hidden;
      }

      .storage-bar {
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
        width: 0%;
        transition: width 0.4s ease;
      }

      /* ── Toast ── */
      #toast {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: var(--text);
        color: var(--bg);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.3px;
        padding: 7px 16px;
        border-radius: 20px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── Scrollbar ── */
      .notes-list::-webkit-scrollbar {
        width: 4px;
      }
      .notes-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .notes-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .date-heading,
      .domain-row,
      .note-top,
      .note-actions {
        user-select: none;
        -webkit-user-select: none;
      }

      /* ── Tabs ── */
      .tabs {
        display: flex;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      .tab-btn {
        flex: 1;
        background: none;
        border: none;
        padding: 10px 0 9px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
      }

      .tab-btn:hover {
        color: var(--text);
      }

      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .tab-panel {
        display: none;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .tab-panel.active {
        display: flex;
      }

      /* ── Notepad (Tab 2) ── */
      .notepad-wrap {
        padding: 14px 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 420px;
      }

      .notepad-hint {
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        color: var(--muted);
        letter-spacing: 0.2px;
        line-height: 1.7;
      }

      .notepad-hint code {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
        color: var(--text);
      }

      .notepad-textarea {
        flex: 1;
        /* height: 140px; */
        resize: vertical;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "DM Mono", monospace;
        font-size: 12.5px;
        line-height: 1.6;
        padding: 12px;
        outline: none;
        transition: border-color 0.15s;
      }

      .notepad-textarea:focus {
        border-color: var(--accent-border);
      }

      /* ── Live preview pane ── */
      .notepad-preview-wrap {
        /* display: flex; */
        display: none;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-height: 0;
      }

      .notepad-preview-label {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .notepad-preview-box {
        flex: 1;
        min-height: 110px;
        max-height: 220px;
        overflow-y: auto;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .notepad-preview-placeholder {
        color: var(--muted);
        font-style: italic;
        font-size: 12.5px;
      }

      .notepad-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .notepad-target {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 60%;
      }

      .btn-primary {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        padding: 7px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      .btn-primary:hover {
        opacity: 0.88;
      }

      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── Typed Notes (Tab 3) ── */
      .typed-list {
        padding: 10px 14px;
        overflow-y: auto;
        flex: 1;
        min-height: 380px;
        max-height: 420px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      /* Rendered markdown output inside a note card */
      /* ── Collapsible md-content ── */
      .md-content {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
        /* Collapsed: ~15 lines × 1.6 × 13px ≈ 312px */
        max-height: 312px;
        overflow: hidden;
        transition: max-height 0.3s ease;
        position: relative;
      }

      /* Fade-out gradient at the bottom when collapsed */
      .md-content:not(.expanded)::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: linear-gradient(to bottom, transparent, var(--surface2));
        pointer-events: none;
      }

      .md-content.expanded {
        max-height: none;
      }

      .md-content.expanded::after {
        display: none;
      }

      .md-content h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 19px;
        line-height: 1.3;
        margin: 2px 0 4px;
      }

      .md-content h2 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 16px;
        line-height: 1.3;
        margin: 2px 0 4px;
      }

      .md-content h3 {
        font-weight: 600;
        font-size: 13.5px;
        line-height: 1.3;
        margin: 2px 0 3px;
      }

      .md-content u {
        text-decoration: underline;
      }

      .md-content .md-box {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        margin: 6px 0;
        background: var(--surface2);
      }

      .md-content .md-image {
        display: block;
        max-width: 100%;
        border-radius: 6px;
        margin: 6px 0;
      }

      .md-content pre.md-code {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 4px 0;
        overflow-x: auto;
        white-space: pre;
      }

      .md-content pre.md-code code {
        font-family: "DM Mono", monospace;
        font-size: 12px;
      }

      /* ── Typed note action row (expand + copy) ── */
      .typed-card-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 7px;
      }

      .typed-expand-btn {
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.3px;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 3px 9px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.15s;
        flex-shrink: 0;
      }

      .typed-expand-btn:hover {
        border-color: var(--accent-border);
        color: var(--accent);
        background: var(--accent-dim);
      }

      .typed-copy-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        width: 24px;
        height: 24px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.15s;
        padding: 0;
        flex-shrink: 0;
      }

      .typed-copy-btn:hover {
        border-color: var(--accent-border);
        color: var(--accent);
        background: var(--accent-dim);
      }

      .typed-copy-btn.copied {
        border-color: var(--green);
        color: var(--green);
      }

      /* ── Utility ── */
      [hidden] {
        display: none !important;
      }

      /* ── Notebook dropdown (Notepad tab) ── */
      .nb-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        z-index: 20;
      }

      .nb-label {
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .nb-dropdown {
        position: relative;
      }

      .nb-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 220px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .nb-trigger:hover,
      .nb-dropdown.open .nb-trigger {
        border-color: var(--accent-border);
      }

      .nb-trigger-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nb-trigger-label.placeholder {
        color: var(--muted);
      }

      .nb-caret {
        font-size: 9px;
        color: var(--muted);
      }

      .nb-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: 100%;
        max-height: 210px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        padding: 4px;
        z-index: 50;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .nb-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 5px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .nb-item:hover {
        background: var(--accent-dim);
      }

      .nb-item.selected {
        color: var(--accent);
      }

      .nb-check {
        width: 10px;
        font-size: 10px;
        flex-shrink: 0;
      }

      .nb-item-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nb-item-name.muted {
        color: var(--muted);
        font-style: italic;
      }

      .nb-rename-input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--accent-border);
        border-radius: 4px;
        padding: 2px 6px;
        outline: none;
      }

      .nb-add {
        margin-top: 4px;
        padding: 8px 8px 6px;
        border-top: 1px solid var(--border);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        color: var(--accent);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        border-radius: 0 0 5px 5px;
      }

      .nb-add:hover {
        background: var(--accent-dim);
      }

      .nb-menu > .nb-add:first-child {
        margin-top: 0;
        border-top: none;
      }

      .nb-hint {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.2px;
      }

      .nb-edit-badge {
        margin-left: auto;
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-dim);
        border: 1px solid var(--accent-border);
        border-radius: 20px;
        padding: 2px 9px;
      }

      .notepad-btns {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-ghost {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-ghost:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      /* ── Typed tab: toolbar, notebook chip, edit button ── */
      .typed-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px 0;
      }

      .typed-count {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      .typed-filter {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        max-width: 240px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        border-radius: 6px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .typed-filter:hover,
      .typed-filter:focus {
        border-color: var(--accent-border);
      }

      .nb-chip {
        display: inline-block;
        margin-left: 8px;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.3px;
        color: var(--accent);
        background: var(--accent-dim);
        border: 1px solid var(--accent-border);
        border-radius: 20px;
        padding: 1px 8px;
      }

      /* Edit button only appears while hovering the card */
      .typed-edit-btn {
        opacity: 0;
      }

      .note-card:hover .typed-edit-btn,
      .typed-edit-btn:focus-visible {
        opacity: 1;
      }

      /* ── Dock toggle ── */
      .dock-toggle {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-right: 4px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.15s;
      }

      .dock-toggle:hover {
        color: var(--text);
      }

      .dock-toggle input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .dock-switch {
        position: relative;
        width: 30px;
        height: 17px;
        flex-shrink: 0;
        border-radius: 20px;
        background: var(--surface2);
        border: 1px solid var(--border);
        transition: all 0.15s;
      }

      .dock-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          transform 0.15s,
          background 0.15s;
      }

      .dock-toggle input:checked + .dock-switch {
        background: var(--accent-dim);
        border-color: var(--accent-border);
      }

      .dock-toggle input:checked + .dock-switch::after {
        transform: translateX(13px);
        background: var(--accent);
      }

      .dock-toggle input:focus-visible + .dock-switch {
        outline: 2px solid var(--accent-border);
        outline-offset: 2px;
      }

      /* ── Docked side-panel layout (popup.html?mode=panel) ──
         The popup is a fixed 600px box; the side panel must instead fill
         whatever width/height Chrome gives it (and the user can drag that). */
      html.is-panel,
      html.is-panel body {
        height: 100%;
      }

      html.is-panel body {
        width: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      html.is-panel .header {
        flex-wrap: wrap;
        gap: 8px;
      }

      html.is-panel .notes-list,
      html.is-panel .typed-list {
        min-height: 0;
        max-height: none;
      }

      html.is-panel .notepad-wrap {
        min-height: 0;
        overflow-y: auto;
      }

      html.is-panel .notepad-textarea {
        min-height: 160px;
      }

      html.is-panel .notepad-actions {
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ── Typed tab: export button + format menu ── */
      .typed-toolbar {
        flex-wrap: wrap;
      }

      .typed-toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .export-wrap {
        position: relative;
      }

      .export-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 9px;
        border-radius: 6px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }

      .export-btn:hover,
      .export-btn[aria-expanded="true"] {
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .export-btn:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .export-caret {
        font-size: 9px;
        opacity: 0.7;
      }

      .export-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 50;
        min-width: 150px;
        display: flex;
        flex-direction: column;
        padding: 4px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }

      .export-menu[hidden] {
        display: none;
      }

      .export-menu button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        text-align: left;
        background: transparent;
        border: none;
        color: var(--text);
        padding: 7px 9px;
        border-radius: 5px;
        cursor: pointer;
      }

      .export-sep {
        height: 1px;
        margin: 4px 2px;
        background: var(--border);
      }

      .export-menu button span {
        color: var(--muted);
        font-size: 10px;
      }

      .export-menu button:hover,
      .export-menu button:focus-visible {
        background: var(--accent-dim);
        color: var(--accent);
        outline: none;
      }

      /* ── Notepad: snapshot button + image strip (shown while writing) ── */
      .snap-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .snap-btn:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      /* ── Notepad editor with inline images ── */
      .notepad-textarea {
        overflow-y: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-height: 120px;
        cursor: text;
      }

      /* Dropdown popup: a fixed-height box that scrolls inside itself (a plain
         flex child would grow with the text and push the popup taller instead).
         The docked panel already has a bounded height, so it fills the space. */
      html:not(.is-panel) .notepad-textarea {
        flex: none;
        height: 280px;
      }

      /* Room under the last line so the text can scroll up past the caret */
      .notepad-textarea {
        padding-bottom: min(110px, 22vh);
      }

      .notepad-textarea.is-empty::before {
        content: attr(data-placeholder);
        color: var(--muted);
        pointer-events: none;
      }

      .img-chip {
        position: relative;
        display: inline-block;
        vertical-align: middle;
        margin: 2px 3px;
        line-height: 0;
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        cursor: zoom-in;
        user-select: none;
        -webkit-user-select: none;
      }

      .img-chip img {
        display: block;
        height: 60px;
        width: auto;
        max-width: 140px;
        object-fit: cover;
        border-radius: 5px;
      }

      .img-chip:hover {
        border-color: var(--accent-border);
      }

      /* Double-click: a bit bigger; click anywhere else shrinks it again */
      .img-chip.expanded {
        display: block;
        width: fit-content;
        margin: 6px 0;
        cursor: zoom-out;
      }

      .img-chip.expanded img {
        height: auto;
        max-height: 240px;
        max-width: 100%;
      }

      .img-chip.missing img {
        display: none;
      }

      .img-chip.missing::after {
        content: "image unavailable";
        display: block;
        padding: 8px 10px;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        line-height: 1.2;
        color: var(--muted);
      }

      .img-del {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 17px;
        height: 17px;
        line-height: 16px;
        text-align: center;
        font-size: 13px;
        color: #fff;
        background: rgba(20, 20, 30, 0.75);
        border-radius: 50%;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .img-del::before {
        content: "×";
      }

      .img-chip:hover .img-del {
        opacity: 1;
      }

      /* ── Search: Typed tab + notepad find bar ── */
      #panel-typed > .search-wrap {
        flex-shrink: 0;
      }

      .find-bar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      .find-bar[hidden] {
        display: none;
      }

      .find-bar .search-icon {
        left: 11px;
      }

      .find-bar input[type="text"] {
        min-width: 0;
        font-size: 12px;
        padding: 6px 10px 6px 28px;
      }

      .find-count {
        min-width: 46px;
        text-align: right;
        white-space: nowrap;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: var(--muted);
      }

      .find-count.none {
        color: #e06c75;
      }

      /* While the find bar is open the (fixed-height) popup editor gives up its height */
      html:not(.is-panel) .notepad-wrap.finding .notepad-textarea {
        height: 236px;
      }

      ::highlight(typed-hit),
      ::highlight(find-hit) {
        background-color: rgba(250, 204, 21, 0.55);
        color: inherit;
      }

      ::highlight(find-current) {
        background-color: rgba(251, 146, 60, 0.9);
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <h3 class="app-name">My <em>Notes</em></h3>
        <span class="note-pill" id="noteCount">0</span>
      </div>
      <div class="header-right">
        <label
          class="dock-toggle"
          title="Dock to the right side of the page. Open with ⌘M / Ctrl+M or the toolbar icon."
        >
          <span class="dock-label">Dock</span>
          <input type="checkbox" id="dockToggle" />
          <span class="dock-switch"></span>
        </label>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">☽</button>
        <button class="btn-full" id="openFullBtn">Full view ↗</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn" data-tab="notes">Notes</button>
      <button class="tab-btn active" data-tab="notepad">Notepad</button>
      <button class="tab-btn" data-tab="typed">Typed</button>
    </div>

    <div class="tab-panel" id="panel-notes">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search notes, domains, URLs…"
        />
        <div class="search-actions">
          <button
            class="search-action-btn"
            id="caseSensitiveBtn"
            title="Match Case (Aa)"
          >
            Aa
          </button>
          <button
            class="search-action-btn"
            id="copyAllBtn"
            title="Copy All Filtered Notes"
          ></button>
        </div>
      </div>

      <div id="notesList" class="notes-list"></div>

      <div id="pagination" class="pagination" style="display: none"></div>
    </div>

    <div class="tab-panel active" id="panel-notepad">
      <div class="notepad-wrap">
        <div class="notepad-hint">
          <!-- <code># text</code> → small heading · <code>## text</code> → medium
          heading · <code>### text</code> → large heading ·
          <code>:text:</code> → underline · <code>[Code]…[Code]</code> → code
          block · <code>&gt;C text &gt;C</code> → boxed ·  -->
          paste an image or
          press <code id="snapKeyHint">Ctrl+Shift+S</code> to snapshot the page
          (double-click an image to enlarge) ·
          <code>( { [ &lt;</code> auto-close brackets · -x5 or -*5 equal -----
        </div>
        <div class="find-bar" id="findBar" hidden>
          <span class="search-icon">⌕</span>
          <input type="text" id="findInput" placeholder="Find in this note…" />
          <span class="find-count" id="findCount"></span>
          <button
            class="search-action-btn"
            id="findCaseBtn"
            title="Match Case (Aa)"
          >
            Aa
          </button>
          <button
            class="search-action-btn"
            id="findPrevBtn"
            title="Previous match (Shift+Enter)"
          >
            ↑
          </button>
          <button
            class="search-action-btn"
            id="findNextBtn"
            title="Next match (Enter)"
          >
            ↓
          </button>
          <button
            class="search-action-btn"
            id="findCloseBtn"
            title="Close (Esc)"
          >
            ✕
          </button>
        </div>
        <div
          id="notepadTextarea"
          class="notepad-textarea is-empty"
          contenteditable="plaintext-only"
          role="textbox"
          aria-multiline="true"
          spellcheck="true"
          data-placeholder="Type your note here… paste an image or snapshot the page, or wrap text in >C … >C for a box"
        ></div>
        <div class="notepad-preview-wrap">
          <div class="notepad-preview-label">Live preview</div>
          <div class="notepad-preview-box">
            <div id="notepadPreview" class="md-content expanded"></div>
          </div>
        </div>
        <div class="notepad-actions">
          <span class="notepad-target" id="notepadTarget"></span>
          <div class="nb-bar">
            <div class="nb-dropdown" id="nbDropdown">
              <button
                type="button"
                class="nb-trigger"
                id="nbTrigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="nb-trigger-label placeholder" id="nbTriggerLabel"
                  >No notebook</span
                >
                <span class="nb-caret">▾</span>
              </button>
              <div class="nb-menu" id="nbMenu" role="listbox" hidden></div>
            </div>
            <!-- <span class="nb-hint" id="nbHint"
              >double-click a notebook to rename</span
            >
            <span class="nb-edit-badge" id="editBadge" hidden
              >✎ Editing note</span
            > -->
          </div>
          <div class="notepad-btns">
            <button
              class="btn-ghost snap-btn"
              id="findToggleBtn"
              title="Find in this note (⌘F / Ctrl+F)"
              aria-label="Find in this note"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
            </button>
            <button
              class="btn-ghost snap-btn"
              id="snapshotBtn"
              title="Snapshot this page into the note"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                />
                <circle cx="12" cy="13" r="4" />
              </svg>
              Snapshot
            </button>
            <button class="btn-ghost" id="cancelEditBtn" hidden>Cancel</button>
            <button class="btn-primary" id="saveNoteBtn">Save note</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-typed">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          id="typedSearchInput"
          placeholder="Search typed notes, titles, URLs…"
        />
        <div class="search-actions">
          <button
            class="search-action-btn"
            id="typedCaseBtn"
            title="Match Case (Aa)"
          >
            Aa
          </button>
        </div>
      </div>
      <div class="typed-toolbar">
        <span class="typed-count" id="typedCount"></span>
        <div class="typed-toolbar-right">
          <button
            class="export-btn"
            id="importBtn"
            title="Import a JSON backup (adds to what you already have)"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 15V3" />
              <path d="m7 8 5-5 5 5" />
              <path d="M5 21h14" />
            </svg>
            Import
          </button>
          <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            hidden
          />
          <div class="export-wrap">
            <button
              class="export-btn"
              id="exportBtn"
              title="Export the notes shown below"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3v12" />
                <path d="m7 10 5 5 5-5" />
                <path d="M5 21h14" />
              </svg>
              Export
              <span class="export-caret">▾</span>
            </button>
            <div class="export-menu" id="exportMenu" hidden>
              <button data-format="pdf">PDF <span>.pdf</span></button>
              <button data-format="md">Markdown <span>.md</span></button>
              <button data-format="txt">Plain text <span>.txt</span></button>
              <div class="export-sep"></div>
              <button
                data-format="json"
                title="Everything: all notebooks, notes and the saved selections from the first tab"
              >
                JSON backup <span>.json</span>
              </button>
            </div>
          </div>
          <select
            id="typedFilter"
            class="typed-filter"
            title="Filter by notebook"
          ></select>
        </div>
      </div>
      <div id="typedNotesList" class="typed-list"></div>
      <div id="typedPagination" class="pagination" style="display: none"></div>
    </div>

    <div class="footer">
      <div class="footer-stat" id="storageText">0 KB</div>
      <div style="display: flex; align-items: center; gap: 7px">
        <div class="storage-bar-wrap">
          <div class="storage-bar" id="storageBar"></div>
        </div>
        <div class="footer-stat" id="storageLabel">used</div>
      </div>
    </div>

    <div id="toast"></div>

    <script src="markdown.js"></script>
